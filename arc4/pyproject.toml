[project]
name = "arc4"
version = "0.1.0"
description = "CRM de Cobrança ARC4 — workspace (importador, API e migrations)"
requires-python = ">=3.12"
dependencies = ["arc4-importador", "arc4-api"]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
  "httpx>=0.28",
]
db = [
  "alembic>=1.14",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2",
]

[tool.uv]
package = false
default-groups = ["dev", "db"]

[tool.uv.workspace]
members = ["importador", "api"]

[tool.uv.sources]
arc4-importador = { workspace = true }
arc4-api = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["importador/tests", "api/tests", "db/tests"]
addopts = "-ra --import-mode=importlib"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs/diagnostico/scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM"]
ignore = [
  "S101",   # assert é o idioma do pytest
  "SIM300", # "A <= B" em conjuntos lê melhor como subconjunto
]

[tool.ruff.lint.isort]
known-first-party = ["arc4_api", "arc4_importador"]

[tool.ruff.lint.per-file-ignores]
"db/migrations/**" = ["S608"]
