[project]
name = "arc4-importador"
version = "0.1.0"
description = "Leitura dos ZIPs do banco, dicionário de colunas e fixtures sintéticas"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
arc4-fixtures = "arc4_importador.fixtures:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arc4_importador"]
