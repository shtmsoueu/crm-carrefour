services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crm_carrefour
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm_carrefour']
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://crm:${DB_PASSWORD}@db:5432/crm_carrefour
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET}
      AGENCY_CODE: ${AGENCY_CODE:-}
    ports: ['3333:3333']
    volumes: [storage:/data/storage]
volumes:
  db-data:
  storage:
