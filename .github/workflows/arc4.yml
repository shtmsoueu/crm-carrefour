# CI do CRM ARC4 (pasta arc4/). Não afeta o CRM Carrefour da raiz.
name: arc4

on:
  push:
    paths: ["arc4/**", ".github/workflows/arc4.yml"]
  pull_request:
    paths: ["arc4/**", ".github/workflows/arc4.yml"]

permissions:
  contents: read

concurrency:
  group: arc4-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: arc4

jobs:
  python:
    name: Python · lint e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: arc4
          POSTGRES_PASSWORD: arc4
          POSTGRES_DB: arc4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U arc4 -d arc4"
          --health-interval 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://arc4:arc4@localhost:5432/arc4
      DATABASE_URL: postgresql://arc4:arc4@localhost:5432/arc4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: arc4/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - name: Migrations em banco vazio, duas vezes (F0.3)
        run: make migrate && make migrate
      - run: uv run pytest

  web:
    name: Web · lint, testes e build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: arc4/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: arc4/web/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run lint
      - run: npm test
      - run: npm run build

  compose:
    name: Docker Compose · sobe e responde /health (F0.2)
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait
      - run: curl -fsS http://localhost:8000/health
      - run: curl -fsS http://localhost:8080/api/health
      - if: always()
        run: docker compose logs --no-color api web | tail -100
      - if: always()
        run: docker compose down -v
